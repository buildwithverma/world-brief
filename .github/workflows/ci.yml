name: Verify World Brief
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: worldbrief
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-lock.txt
      - run: python -m scripts.migrate
        env:
          DATABASE_URL: postgresql://postgres:test-only@localhost:5432/worldbrief
      - run: python -m pytest tests -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/worldbrief
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: node --test tests/*.test.mjs
      - run: pnpm --dir web exec tsc --noEmit
      - run: pnpm --dir web run build:static
        env:
          VITE_API_URL: https://api.example.com
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: public-ci-placeholder
      - run: docker build -t world-brief-api:test .
