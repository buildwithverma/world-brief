name: Refresh temporary articles
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: read
concurrency:
  group: world-brief-collection
  cancel-in-progress: false
jobs:
  collect:
    if: vars.ENABLE_SCHEDULED_COLLECTION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-lock.txt
      - uses: actions/cache@v4
        with:
          path: data/models
          key: minilm-v1-${{ runner.os }}-${{ hashFiles('requirements-lock.txt', 'scripts/setup_vectors.py') }}
      - run: python scripts/setup_vectors.py
      - run: python -m scripts.collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_DAILY_TOKEN_BUDGET: '30000'
          NEWS_COUNTRY: ${{ vars.NEWS_COUNTRY || 'IN' }}
