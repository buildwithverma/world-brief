services:
  - type: web
    name: world-brief-api
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: OWNER_USER_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_DAILY_TOKEN_BUDGET
        value: "30000"
